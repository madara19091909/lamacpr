name: Build LAMMA APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.lamma --project-name social .
          fi

      # flutter create يولّد اختبار يشير لتطبيق افتراضي (MyApp) غير موجود بمشروعك
      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      # صلاحية الإنترنت: قالب flutter create يضيفها لنسخ debug/profile فقط،
      # وبدونها نسخة release ما تتصل بـ Firebase ولا بـ Cloudflare.
      - name: Ensure INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET" \/>/' "$MANIFEST"
          fi
          grep -n 'INTERNET' "$MANIFEST" || true

      # مكتبات Firebase تحتاج minSdk 23 على الأقل
      - name: Set minSdk to 23
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i 's/flutter\.minSdkVersion/23/g' "$f"; fi
          done

      # يثبّت بصمة SHA-1 بين كل عملية بناء (مطلوب لزر الدخول بجوجل). اختياري.
      - name: Restore stable signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          fi

      - name: Get packages
        run: flutter pub get

      # توليد أيقونة التطبيق من assets/icon/app_icon.png وكتابتها داخل android/
      # (بدون هذه الخطوة يبقى التطبيق بأيقونة فلاتر الافتراضية)
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lamma-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
